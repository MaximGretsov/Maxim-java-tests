apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine

          command:
            - sh
            - -c
            - >
              until pg_isready
              -h postgres
              -p 5432
              -U "$POSTGRES_USER"
              -d nbank;
              do
                echo "Waiting for PostgreSQL...";
                sleep 2;
              done

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username

      containers:
        - name: backend
          image: nobugsme/nbank:with_fraud_check_with_transfer_fix
          imagePullPolicy: {{ .Values.imagePullPolicy }}

          ports:
            - containerPort: 4111

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/nbank

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver

            - name: FRAUD_DETECTION_SERVICE_URL
              value: http://host.minikube.internal:9090

          readinessProbe:
            tcpSocket:
              port: 4111
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend

spec:
  selector:
    app: backend

  ports:
    - name: http
      protocol: TCP
      port: 4111
      targetPort: 4111
      nodePort: 30111

  type: NodePort